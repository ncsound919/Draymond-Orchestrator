<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" fill="none">
  <defs>
    <linearGradient id="redHand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="darkHand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="greenArrow" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="greenArrow2" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Left hand (red) -->
  <g filter="url(#shadow)">
    <path d="M95 280 C70 260, 55 230, 55 200 C55 185, 60 170, 70 160 L80 148 C85 142, 88 134, 88 126 L88 110 C88 100, 94 92, 102 92 C110 92, 116 100, 116 110 L116 140 M80 148 L74 135 C70 126, 72 116, 80 112 C88 108, 98 112, 102 120 L116 140 M116 140 L130 108 C134 98, 144 94, 152 98 C160 102, 164 112, 160 122 L146 155 M146 155 L158 125 C162 116, 172 112, 180 116 C188 120, 190 130, 186 140 L170 175 M170 175 C175 170, 180 165, 180 160 C182 152, 190 148, 196 152 C202 156, 204 164, 200 172 L180 210 C170 235, 148 260, 120 275 Z" fill="url(#redHand)"/>
  </g>

  <!-- Right hand (dark) -->
  <g filter="url(#shadow)">
    <path d="M305 280 C330 260, 345 230, 345 200 C345 185, 340 170, 330 160 L320 148 C315 142, 312 134, 312 126 L312 110 C312 100, 306 92, 298 92 C290 92, 284 100, 284 110 L284 140 M320 148 L326 135 C330 126, 328 116, 320 112 C312 108, 302 112, 298 120 L284 140 M284 140 L270 108 C266 98, 256 94, 248 98 C240 102, 236 112, 240 122 L254 155 M254 155 L242 125 C238 116, 228 112, 220 116 C212 120, 210 130, 214 140 L230 175 M230 175 C225 170, 220 165, 220 160 C218 152, 210 148, 204 152 C198 156, 196 164, 200 172 L220 210 C230 235, 252 260, 280 275 Z" fill="url(#darkHand)"/>
  </g>

  <!-- Green arrow (trending up) -->
  <g filter="url(#glow)">
    <!-- Arrow shaft -->
    <path d="M160 240 L185 180 L200 200 L230 120 L260 120 L220 80 L180 120 L210 120 L185 180 L168 210 Z" fill="url(#greenArrow)"/>

    <!-- Arrow head -->
    <polygon points="220,80 250,50 180,50" fill="url(#greenArrow2)"/>

    <!-- Sparkle elements -->
    <polygon points="250,75 256,60 262,75 277,80 262,85 256,100 250,85 235,80" fill="#4ade80" opacity="0.8"/>
    <polygon points="155,90 159,82 163,90 171,93 163,96 159,104 155,96 147,93" fill="#4ade80" opacity="0.6"/>
    <polygon points="240,110 243,104 246,110 252,112 246,114 243,120 240,114 234,112" fill="#86efac" opacity="0.7"/>
  </g>

  <!-- Text: THE UPLIFT -->
  <text x="200" y="345" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="46" letter-spacing="4" fill="#e5e7eb">THE UPLIFT</text>

  <!-- Text: LAB -->
  <text x="200" y="395" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="52" letter-spacing="6" fill="#dc2626">LAB</text>
</svg>
