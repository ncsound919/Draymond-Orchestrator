name: Build & Release

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  electron:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint + Type-check
        run: npm run lint && npm run type-check

      - name: Test
        run: npm test

      - name: Build web bundle
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://theupliftlab.com
          DRAYMOND_DB_PATH: ./data/draymond.db
          DRAYMOND_ADMIN_EMAIL: ci@localhost
          DRAYMOND_ADMIN_PASSWORD: ci-build-only

      - name: Build Electron app
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: draymond-orchestrator-${{ matrix.os }}
          path: release/*

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
