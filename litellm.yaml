    auth_value: os.environ/ECOSYSTEM_CONTROL_TOKEN
    description: "Overlay365/Uplift ecosystem control (read-only): fleet status, health, history, models."
    allowed_tools:
      - get_fleet_status
      - get_monitor
      - get_history
      - get_models
