# LiteLLM proxy config — routes LLM calls to configured providers.
# Keys come from .env.local (process env). Only providers with keys are usable.
# This mirrors the universal fallback in src/lib/draymond/llm.ts:
#   free (opencode-free) → go (opencode) → deepseek → gemini → ollama (local).
model_list:
  - model_name: opencode-free
    litellm_params:
      model: openai/deepseek-v4-flash-free
      api_key: os.environ/OPENCODE_API_KEY
      api_base: https://opencode.ai/zen/v1
  - model_name: opencode
    litellm_params:
      model: openai/deepseek-v4-flash
      api_key: os.environ/OPENCODE_API_KEY
      api_base: https://opencode.ai/zen/go/v1
  - model_name: opencode-pro
    litellm_params:
      model: openai/deepseek-v4-pro
      api_key: os.environ/OPENCODE_API_KEY
      api_base: https://opencode.ai/zen/go/v1
  - model_name: deepseek
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
  - model_name: deepseek-reasoner
    litellm_params:
      model: deepseek/deepseek-reasoner
      api_key: os.environ/DEEPSEEK_API_KEY
  - model_name: gemini
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: ollama-llama
    litellm_params:
      model: ollama/llama3.2:1b
      api_base: http://localhost:11434
  - model_name: ollama-qwen
    litellm_params:
      model: ollama/qwen3.5:4b
      api_base: http://localhost:11434

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: null
  drop_params: true

litellm_settings:
  drop_params: true
  set_verbose: false
